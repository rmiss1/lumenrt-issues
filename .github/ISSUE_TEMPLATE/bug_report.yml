name: "Bug Report"
description: "Report a reproducible bug or rendering issue in Lumen RT."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Lumen RT bug. Please search existing issues before submitting.
        This tracker is primarily for **bug reports**. Please keep general questions to a minimum; feature requests and suggestions belong elsewhere.
        When possible, include both Minecraft's `latest.log` and Lumen RT's own log files.
        Do not include passwords, tokens, or other sensitive information in logs.
  - type: input
    id: lumen-version
    attributes:
      label: Lumen RT version
      description: "Include the complete version number, including alpha/dev suffix."
      placeholder: "e.g. 0.1.4-alpha.dev.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: GPU series
      description: "Select your GPU series."
      options:
        - NVIDIA GeForce RTX 30xx
        - NVIDIA GeForce RTX 40xx
        - NVIDIA GeForce RTX 50xx
        - AMD Radeon RX 5000
        - AMD Radeon RX 6000
        - AMD Radeon RX 7000
        - AMD Radeon RX 9000
        - Other
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: "Describe the bug and its impact. Include any error messages."
      placeholder: "Explain the problem clearly."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Provide numbered steps so the issue can be reproduced."
      placeholder: |
        1. Launch the game with ...
        2. Enable ...
        3. Enter a world ...
        4. Observe ...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What should have happened instead?"
    validations:
      required: false
  - type: textarea
    id: mods
    attributes:
      label: Other mods and resource packs
      description: "List relevant mods and versions, or write 'None'. Include anything needed to reproduce the issue."
      placeholder: "Fabric API ..., Physics Mod ..., Grassier Grass ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash reports, and screenshots
      description: "Please attach both Minecraft's latest.log and Lumen RT's own log files, if available. Add relevant crash reports or screenshots too. Check files for personal information or secrets first."
      placeholder: "Attach latest.log, Lumen RT log files, crash reports, screenshots, or video links here."
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: "I searched existing issues and did not find a duplicate."
          required: true
        - label: "I understand this tracker is primarily for bugs and that general questions should be kept to a minimum."
          required: true
